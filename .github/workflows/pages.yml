# Страница проекта на GitHub Pages: содержимое папки docs/ (index.html, скриншоты, GIF).
# Публикуется при изменении docs/ в main и ручным запуском (Actions → «Сайт» → Run workflow).
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Скриншоты и GIF пересоздаёт python tools/screenshots.py.
name: Сайт

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
