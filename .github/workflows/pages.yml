# Страница проекта на GitHub Pages: содержимое папки docs/ (index.html, скриншоты, GIF).
# Публикуется только ручным запуском (Actions → «Сайт» → Run workflow): у приватного репозитория на бесплатном
# тарифе Pages нет, и запуск при каждом пуше падал бы. Когда Pages станут доступны (публичный репозиторий или
# платный тариф): Settings → Pages → Build and deployment → Source: GitHub Actions, затем запустить вручную;
# публикацию при изменении docs/ можно вернуть, добавив в on: push с branches: [main] и paths: ["docs/**"].
# Скриншоты и GIF пересоздаёт python tools/screenshots.py.
name: Сайт

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
