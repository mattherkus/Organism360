# Сборка установщика OrganismAtlas-Setup-<версия>.exe на Windows (tools/build_setup.py).
# Каждый запуск кладёт установщик в «Artifacts» на странице запуска (Actions).
# В Releases (оттуда пользователи скачивают setup.exe) его выкладывают тег v* (например v1.0.0) или
# ручной запуск: Actions → «Установщик» → Run workflow - тогда тег v<organism_atlas.__version__> ставится сам.
name: Установщик

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"                  # консоль раннера - cp1252, а скрипты пишут по-русски
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          choco install innosetup -y --no-progress
      - name: Сборка
        run: python tools/build_setup.py
      - uses: actions/upload-artifact@v5
        with:
          name: OrganismAtlas-Setup
          path: dist/OrganismAtlas-Setup-*.exe
          if-no-files-found: error
      - name: Версия
        id: ver
        run: python -c "import organism_atlas; print('tag=v' + organism_atlas.__version__)" >> $env:GITHUB_OUTPUT
      - name: Выпуск
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Атлас организма ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            Скачайте **OrganismAtlas-Setup-*.exe** ниже, откройте его, выберите папку и нажмите «Установить».
            Python не нужен. Первый запуск может занять пару минут — Защитник Windows проверяет новые файлы.
          files: dist/OrganismAtlas-Setup-*.exe
