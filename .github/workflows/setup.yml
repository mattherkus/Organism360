# Сборка программы: установщик OrganismAtlas-Setup-<версия>.exe на Windows (tools/build_setup.py) и архивы
# для macOS (OrganismAtlas.app в zip) и Linux (папка в tar.gz) - tools/build_exe.py --archive.
# Каждый запуск кладёт их в «Artifacts» на странице запуска (Actions).
# В Releases (оттуда пользователи скачивают программу) их выкладывают тег v* (например v1.0.0) или
# ручной запуск: Actions → «Установщик» → Run workflow - тогда тег v<organism_atlas.__version__> ставится сам.
name: Установщик

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # тесты (окно - без экрана, offscreen): без них сборки не начинаются и выпуск не выкладывается
  tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Стиль
        run: ruff check .
      - name: Тесты
        run: python -m unittest discover -s tests -t .

  setup:
    needs: tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"                  # консоль раннера - cp1252, а скрипты пишут по-русски
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          choco install innosetup -y --no-progress
      - name: Сборка
        run: python tools/build_setup.py
      - uses: actions/upload-artifact@v5
        with:
          name: OrganismAtlas-Setup
          path: dist/OrganismAtlas-Setup-*.exe
          if-no-files-found: error

  # macOS и Linux: та же программа без Python, архивом (установщика нет - распаковать и запустить)
  portable:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            files: dist/OrganismAtlas-*-linux.tar.gz
          - os: macos-latest
            files: dist/OrganismAtlas-*-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Сборка
        run: python tools/build_exe.py --archive
      - uses: actions/upload-artifact@v5
        with:
          name: OrganismAtlas-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # выпуск - один на все системы, когда собраны все: так сборки не создают его наперегонки
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [setup, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Версия
        id: ver
        run: |
          tag="v$(python3 -c "import organism_atlas; print(organism_atlas.__version__)")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # тег и версия в программе должны совпадать, иначе файл v1.1.0 окажется в выпуске v1.2.0
            [ "${{ github.ref_name }}" = "$tag" ] || { echo "::error::тег ${{ github.ref_name }}, а версия $tag"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            # ручной запуск: выпуск с этим тегом уже есть - новые файлы попали бы в старый выпуск
            echo "::error::выпуск $tag уже есть: поднимите organism_atlas.__version__"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Выпуск
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Атлас организма ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            **Windows:** скачайте **OrganismAtlas-Setup-*.exe**, откройте его, выберите папку и нажмите «Установить».
            Первый запуск может занять пару минут — Защитник Windows проверяет новые файлы.
            **macOS:** скачайте **OrganismAtlas-*-macos.zip**, распакуйте и откройте OrganismAtlas.app
            (программа не подписана: при первом запуске — правый щелчок → «Открыть»).
            **Linux:** скачайте **OrganismAtlas-*-linux.tar.gz**, распакуйте и запустите OrganismAtlas/OrganismAtlas.
            Python не нужен.
          files: |
            dist/OrganismAtlas-Setup-*.exe
            dist/OrganismAtlas-*-macos.zip
            dist/OrganismAtlas-*-linux.tar.gz
